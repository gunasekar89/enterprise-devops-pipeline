# All values can be overridden with environment variables using Spring's
# relaxed binding, e.g. SERVER_PORT=9090, APP_GREETING=Hi, APP_ENVIRONMENT=dev.
spring:
  application:
    name: enterprise-devops-app
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  greeting: Hello
  environment: local

management:
  endpoints:
    web:
      exposure:
        # Only what operators and Prometheus need; never expose env, beans, heapdump.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${app.environment}
